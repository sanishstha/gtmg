<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1360" viewBox="0 0 980 1360" role="img" aria-labelledby="title desc">
  <title id="title">Code hit by the pipeline</title>
  <desc id="desc">Call order from scripts/run_pipeline.py through ingestion, extraction, the hypothesis agent, and the read API. Solid boxes ran on 7 Oct 2026. Dashed boxes are in the flow and were not reached because the API key was unset.</desc>
  <rect width="980" height="1360" fill="#f6f5f2"/>
  <style>
    .ran { fill: #fffdf8; stroke: #2f6b3a; stroke-width: 2; }
    .idle { fill: #fffdf8; stroke: #8a5a12; stroke-width: 1.75; stroke-dasharray: 6 4; }
    .file { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: #5c574e; }
    .fn { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 650; fill: #1f1d1a; }
    .note { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #5c574e; }
    .banner { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 650; fill: #8a5a12; }
    .arrow { stroke: #3d3a34; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#3d3a34"/>
    </marker>
  </defs>

  <text class="note" x="40" y="36">Solid green: called on the 7 Oct run. Dashed: next in the flow, not reached.</text>

  <rect class="ran" x="250" y="56" width="480" height="62" rx="8"/>
  <text class="file" x="490" y="80" text-anchor="middle">scripts/run_pipeline.py</text>
  <text class="fn" x="490" y="102" text-anchor="middle">main</text>

  <line class="arrow" x1="490" y1="118" x2="490" y2="146"/>

  <rect class="ran" x="250" y="150" width="480" height="62" rx="8"/>
  <text class="file" x="490" y="174" text-anchor="middle">app/pipeline.py</text>
  <text class="fn" x="490" y="196" text-anchor="middle">run_pipeline</text>

  <line class="arrow" x1="490" y1="212" x2="490" y2="240"/>

  <rect class="ran" x="250" y="244" width="480" height="72" rx="8"/>
  <text class="file" x="490" y="268" text-anchor="middle">app/agents/seed.py</text>
  <text class="fn" x="490" y="290" text-anchor="middle">seed_hypotheses</text>
  <text class="note" x="490" y="306" text-anchor="middle">writes hypotheses and a CREATE revision at 0.50</text>

  <line class="arrow" x1="490" y1="316" x2="490" y2="344"/>

  <rect class="ran" x="250" y="348" width="480" height="86" rx="8"/>
  <text class="file" x="490" y="372" text-anchor="middle">app/ingestion/rss.py</text>
  <text class="fn" x="490" y="394" text-anchor="middle">fetch_feeds</text>
  <text class="note" x="490" y="414" text-anchor="middle">parse_rss, html_to_text, _body_for_item</text>

  <line class="arrow" x1="490" y1="434" x2="490" y2="462"/>

  <rect class="ran" x="250" y="466" width="480" height="86" rx="8"/>
  <text class="file" x="490" y="490" text-anchor="middle">app/ingestion/service.py</text>
  <text class="fn" x="490" y="512" text-anchor="middle">ingest_documents</text>
  <text class="note" x="490" y="532" text-anchor="middle">app/text.py content_hash, then ON CONFLICT DO NOTHING</text>

  <line class="arrow" x1="490" y1="552" x2="490" y2="590"/>
  <text class="banner" x="490" y="612" text-anchor="middle">Live run stopped here. OPENAI_API_KEY was unset.</text>
  <line class="arrow" x1="490" y1="624" x2="490" y2="652"/>

  <rect class="idle" x="250" y="656" width="480" height="100" rx="8"/>
  <text class="file" x="490" y="680" text-anchor="middle">app/extraction/service.py</text>
  <text class="fn" x="490" y="702" text-anchor="middle">extract_document</text>
  <text class="note" x="490" y="722" text-anchor="middle">llm.complete_with_retry, then _persist_events or _persist_failure</text>
  <text class="note" x="490" y="740" text-anchor="middle">app/text.py event_fingerprint and locate_quote</text>

  <line class="arrow" x1="490" y1="756" x2="490" y2="784"/>

  <rect class="idle" x="250" y="788" width="480" height="72" rx="8"/>
  <text class="file" x="490" y="812" text-anchor="middle">app/pipeline.py</text>
  <text class="fn" x="490" y="834" text-anchor="middle">_unjudged_events</text>
  <text class="note" x="490" y="850" text-anchor="middle">skips events that already have a successful hypothesis run</text>

  <line class="arrow" x1="490" y1="860" x2="490" y2="888"/>

  <rect class="idle" x="250" y="892" width="480" height="100" rx="8"/>
  <text class="file" x="490" y="916" text-anchor="middle">app/agents/hypothesis.py</text>
  <text class="fn" x="490" y="938" text-anchor="middle">judge_event</text>
  <text class="note" x="490" y="958" text-anchor="middle">_prepare checks evidence ids, _apply writes revisions</text>
  <text class="note" x="490" y="976" text-anchor="middle">app/agents/confidence.py next_confidence sets the stored number</text>

  <line class="arrow" x1="490" y1="992" x2="490" y2="1030"/>

  <rect class="ran" x="250" y="1034" width="480" height="86" rx="8"/>
  <text class="file" x="490" y="1058" text-anchor="middle">app/api/routes.py</text>
  <text class="fn" x="490" y="1080" text-anchor="middle">GET /events, /hypotheses, /runs</text>
  <text class="note" x="490" y="1100" text-anchor="middle">app/storage/queries.py reads the rows. It does not write them.</text>

  <text class="note" x="40" y="1180">Both model steps also write app/models/orm.py AgentRun through the extractor and judge_event.</text>
  <text class="note" x="40" y="1202">A failed extract writes ExtractionFailure. A grounded quote writes Evidence.</text>
  <text class="note" x="40" y="1224">POST /pipeline in app/api/routes.py calls the same run_pipeline function as the script.</text>
</svg>
